name: Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Clean
        run: rm -rf .next

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.lijustore.co.ke
          NEXT_PUBLIC_SITE_URL: https://lijustore.co.ke
          NEXT_PUBLIC_ORDER_EMAIL: ${{ secrets.NEXT_PUBLIC_ORDER_EMAIL }}
          NEXT_PUBLIC_RESEND_FROM_EMAIL: ${{ secrets.NEXT_PUBLIC_RESEND_FROM_EMAIL }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ secrets.NEXT_PUBLIC_CONTACT_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      # Railway auto-deploys from the GitHub repo when connected.
      # Connect your repo at https://railway.app to enable auto-deploy.
